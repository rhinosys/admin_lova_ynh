packaging_format = 2

id = "admin_lova"
name = "Assistant Fablab (AdminLova)"
description.fr = "Assistant IA de chat pour le FabLab, avec RAG sur le wiki historique"
description.en = "AI chat assistant for the FabLab, with RAG over the historical wiki"

version = "0.2.0~ynh1"

maintainers = ["nicolas.rineau"]

[upstream]
license = "free"
website = "https://labovilleurbanne.fr/"
code = "https://github.com/rhinosys/lovAssistant"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "200M"
ram.build = "1G"
ram.runtime = "300M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.mistral_api_key]
    ask.fr = "Clé API Mistral AI (obligatoire, pour le chat et le RAG)"
    ask.en = "Mistral AI API key (required, used for chat and RAG)"
    type = "password"

    [install.ollama_base_url]
    ask.fr = "URL d'un serveur Ollama local sur le réseau (optionnel, laisser vide si non utilisé)"
    ask.en = "URL of a local Ollama server on the LAN (optional, leave empty if unused)"
    type = "string"
    default = ""
    optional = true

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        main.url = "/"
        rag.url = "/api/rag/refresh"
        rag.allowed = "admins"
        rag.show_tile = false
        rag.protected = true
        # Admin area (Framateam account, channels, GDPR removals). nginx marks these paths
        # with X-Lov-Admin so the app grants the admin role only behind this permission.
        admin.url = "/admin"
        admin.additional_urls = ["/api/admin"]
        admin.allowed = "admins"
        admin.show_tile = false
        admin.protected = true

    [resources.ports]
        main.default = 3005

    [resources.apt]
        packages = "postgresql"

    [resources.sources.app]
        url = "https://github.com/rhinosys/lovAssistant/archive/81decd1a0e2e43fcc22ec49195c1feddc5699859.tar.gz"
        sha256 = "63043330acfb754bcb89a1f9c3a9faf10ff0afe4237064bbb5b98a662b0af102"

    [resources.database]
        type = "postgresql"
