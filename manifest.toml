packaging_format = 2

id = "admin_lova"
name = "Assistant Fablab (AdminLova)"
description.fr = "Assistant IA de chat pour le FabLab, avec RAG sur le wiki historique"
description.en = "AI chat assistant for the FabLab, with RAG over the historical wiki"

version = "0.1.0~ynh4"

maintainers = ["nicolas.rineau"]

[upstream]
license = "free"
website = "https://labovilleurbanne.fr/"
code = "https://github.com/rhinosys/lovAssistant"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "200M"
ram.build = "1G"
ram.runtime = "300M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.mistral_api_key]
    ask.fr = "Clé API Mistral AI (obligatoire, pour le chat et le RAG)"
    ask.en = "Mistral AI API key (required, used for chat and RAG)"
    type = "password"

    [install.ollama_base_url]
    ask.fr = "URL d'un serveur Ollama local sur le réseau (optionnel, laisser vide si non utilisé)"
    ask.en = "URL of a local Ollama server on the LAN (optional, leave empty if unused)"
    type = "string"
    default = ""
    optional = true

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        main.url = "/"
        rag.url = "/api/rag/refresh"
        rag.allowed = "admins"
        rag.show_tile = false
        rag.protected = true

    [resources.ports]
        main.default = 3005

    [resources.apt]
        packages = "postgresql"

    [resources.sources.app]
        url = "https://github.com/rhinosys/lovAssistant/archive/44c29bf901d8280ec8b6dd512e1a8eeae10961fd.tar.gz"
        sha256 = "b6e874f5e908854c0c530d3a3cbfaac3f026b26b0feb1229cf158ac5b53c9da6"

    [resources.database]
        type = "postgresql"
