# Match the base path with or without a slash. A prefix location ending in '/'
# makes nginx redirect to a slash that Next.js removes, causing a redirect loop.
# The boundary also prevents /chat from matching a sibling such as /chat-other.
location ~ ^__PATH__(?:/|$) {
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Prevent clients from spoofing SSO identity headers — only SSOwat may set these
  proxy_set_header Remote-User "";
  proxy_set_header Auth-User "";

  # Streaming chat responses use text/event-stream — disable buffering
  proxy_buffering off;
  proxy_read_timeout 300s;

  more_set_headers "Content-Security-Policy: frame-ancestors 'self'";
}
